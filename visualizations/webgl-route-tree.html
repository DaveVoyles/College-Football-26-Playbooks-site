<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Route Tree</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="../assets/styles/site-nav.css" />
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }

    .page-shell {
      position: relative;
      height: 100vh;
      padding-top: calc(var(--site-nav-height, 3.5rem) + 0.5rem);
    }

    .scene-shell,
    .scene-canvas {
      position: absolute;
      inset: calc(var(--site-nav-height, 3.5rem) + 0.5rem) 0 0;
    }

    .scene-shell {
      background:
        radial-gradient(circle at top, var(--cp-sheen), transparent 40%),
        linear-gradient(180deg, var(--cp-bg-elevated), var(--cp-bg));
    }

    .scene-canvas canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .overlay {
      position: absolute;
      z-index: 5;
      inset: calc(var(--site-nav-height, 3.5rem) + 1rem) 1rem 1rem auto;
      width: min(24rem, calc(100vw - 2rem));
      display: grid;
      gap: 1rem;
      pointer-events: none;
    }

    .panel {
      pointer-events: auto;
      padding: 1rem;
      border-radius: 16px;
      border: 1px solid var(--cp-border);
      background: var(--cp-panel);
      backdrop-filter: blur(14px);
      box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14);
    }

    .panel h1,
    .panel h2,
    .panel p {
      margin: 0;
    }

    .eyebrow {
      margin-bottom: 0.45rem;
      color: var(--cp-text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      align-items: flex-start;
      margin-bottom: 0.8rem;
    }

    .category-chip {
      display: inline-flex;
      align-items: center;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      background: var(--cp-accent-soft);
      color: var(--cp-accent);
      font-weight: 700;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .helper {
      color: var(--cp-text-soft);
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .beats-card {
      margin-top: 1rem;
      padding: 0.8rem;
      border-radius: 0.625rem;
      border: 1px solid var(--cp-border);
      background: var(--cp-surface);
    }

    .beats-card span {
      display: block;
      margin-bottom: 0.3rem;
      color: var(--cp-text-muted);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .legend {
      display: grid;
      gap: 0.55rem;
      margin-top: 1rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      padding: 0.55rem 0.7rem;
      border-radius: 0.625rem;
      border: 1px solid var(--cp-border);
      background: var(--cp-surface);
      color: var(--cp-text-muted);
      font-size: 0.88rem;
    }

    .legend-item strong {
      color: var(--cp-text);
      font-size: 0.92rem;
    }

    .legend-label {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
    }

    .legend-label svg {
      flex: 0 0 auto;
    }

    .route-tip {
      margin-top: 0.85rem;
      color: var(--cp-text-soft);
      font-size: 0.88rem;
    }

    @media (max-width: 900px) {
      .overlay {
        inset-inline: 0.75rem;
        width: auto;
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.167.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.167.1/examples/jsm/"
      }
    }
  </script>
  <script defer src="../assets/scripts/site-nav.js"></script>
</head>
<body data-nav-root="..">
  <div class="page-shell">
    <div class="scene-shell">
      <div id="scene" class="scene-canvas" aria-label="3D route tree viewer"></div>
    </div>

    <div class="overlay">
      <section class="panel">
        <div class="title-row">
          <div>
            <div class="eyebrow">Coverage answers</div>
            <h1 id="routeName">Go/Fade</h1>
          </div>
          <span class="category-chip" id="routeCategory">Deep</span>
        </div>
        <p class="helper" id="routeDesc"></p>
        <div class="beats-card">
          <span>Beats</span>
          <strong id="routeBeats">Cover 0, Cover 1</strong>
        </div>
        <p class="route-tip">Click a route tube in the 3D scene to focus it. Drag to orbit, scroll to zoom, and compare leverage from the same release point.</p>
      </section>

      <aside class="panel">
        <div class="eyebrow">Legend</div>
        <h2>All routes</h2>
        <div class="legend" id="legend"></div>
      </aside>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const routes = {
      "Go/Fade": {
        color: 0xef476f, category: "Deep",
        points: [[0,0,0], [0,0,-2], [0.3,0,-6], [0.5,0,-10]],
        desc: "Straight vertical stem. Beat Cover 0/1 with speed.",
        beats: "Cover 0, Cover 1"
      },
      "Post": {
        color: 0xe63946, category: "Deep",
        points: [[0,0,0], [0,0,-2], [0,0,-5], [-2,0,-8]],
        desc: "Vertical stem, break inside toward the post. Attacks deep middle.",
        beats: "Cover 2 (between safeties), Cover 3 (middle hole)"
      },
      "Corner": {
        color: 0xffd166, category: "Deep",
        points: [[0,0,0], [0,0,-2], [0,0,-5], [2.5,0,-8]],
        desc: "Vertical stem, break to sideline corner. The Cover 2 killer.",
        beats: "Cover 2 (honey hole), Cover 6 (field side)"
      },
      "Dig/In": {
        color: 0x06d6a0, category: "Intermediate",
        points: [[0,0,0], [0,0,-2], [0,0,-5], [-3,0,-5]],
        desc: "Vertical stem, sharp break inside at 12-15 yards.",
        beats: "Cover 4 (underneath), Cover 3 (between zones)"
      },
      "Out": {
        color: 0x118ab2, category: "Intermediate",
        points: [[0,0,0], [0,0,-2], [0,0,-5], [3,0,-5]],
        desc: "Vertical stem, sharp break to sideline at 12-15 yards.",
        beats: "Cover 3 (flat area), Man coverage"
      },
      "Comeback": {
        color: 0x8338ec, category: "Intermediate",
        points: [[0,0,0], [0,0,-2], [0,0,-6], [1,0,-4.5]],
        desc: "Deep stem, plant and come back to sideline.",
        beats: "Cover 3, Cover 4, soft man"
      },
      "Curl/Hitch": {
        color: 0x2d6a4f, category: "Short",
        points: [[0,0,0], [0,0,-2], [0,0,-4], [0,0,-3.5]],
        desc: "5-yard stem, stop and turn back to QB.",
        beats: "Cover 4, soft zone, any off-coverage"
      },
      "Slant": {
        color: 0xff6b35, category: "Short",
        points: [[0,0,0], [0,0,-1], [-2,0,-3]],
        desc: "Quick inside break at 1-3 yards. Standard hot route.",
        beats: "Cover 0, Blitz, off-man"
      },
      "Flat/Arrow": {
        color: 0x4dabf7, category: "Short",
        points: [[0,0,0], [0,0,-0.5], [3,0,-1]],
        desc: "Quick out to the flat. Screen/check-down option.",
        beats: "Blitz (hot), Cover 3/4 (flat void)"
      },
      "Drag/Shallow": {
        color: 0xf7b267, category: "Short",
        points: [[0,0,0], [0,0,-1], [-4,0,-1.5]],
        desc: "Shallow cross across the field. Man beater.",
        beats: "Man coverage, Cover 1"
      }
    };

    const routeName = document.getElementById('routeName');
    const routeCategory = document.getElementById('routeCategory');
    const routeDesc = document.getElementById('routeDesc');
    const routeBeats = document.getElementById('routeBeats');
    const legend = document.getElementById('legend');
    const sceneHost = document.getElementById('scene');

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    sceneHost.append(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0f2f14, 16, 34);

    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
    camera.position.set(4.5, 8, 5.5);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, -4);
    controls.enableDamping = true;
    controls.minDistance = 6;
    controls.maxDistance = 18;
    controls.maxPolarAngle = Math.PI / 2.05;
    controls.minPolarAngle = 0.18;

    scene.add(new THREE.AmbientLight(0xffffff, 1.05));
    const sun = new THREE.DirectionalLight(0xffffff, 1.5);
    sun.position.set(6, 10, 5);
    scene.add(sun);

    const createFieldTexture = () => {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1536;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#2f7d32';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < 10; i += 1) {
        const y = 100 + ((canvas.height - 200) / 9) * i;
        ctx.strokeStyle = i === 0 ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.12)';
        ctx.lineWidth = i === 0 ? 10 : 4;
        ctx.beginPath();
        ctx.moveTo(90, y);
        ctx.lineTo(canvas.width - 90, y);
        ctx.stroke();
      }

      ctx.strokeStyle = 'rgba(255,255,255,0.22)';
      ctx.lineWidth = 8;
      ctx.strokeRect(60, 60, canvas.width - 120, canvas.height - 120);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    };

    const field = new THREE.Mesh(
      new THREE.PlaneGeometry(18, 24),
      new THREE.MeshStandardMaterial({ map: createFieldTexture(), roughness: 0.96, metalness: 0.02 })
    );
    field.rotation.x = -Math.PI / 2;
    scene.add(field);

    const losGeometry = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-8.5, 0.03, 0),
      new THREE.Vector3(8.5, 0.03, 0),
    ]);
    const los = new THREE.Line(losGeometry, new THREE.LineBasicMaterial({ color: 0xffffff }));
    scene.add(los);

    const wr = new THREE.Mesh(
      new THREE.SphereGeometry(0.24, 24, 24),
      new THREE.MeshStandardMaterial({ color: 0xf8f9fa, emissive: 0x222222, roughness: 0.3 })
    );
    wr.position.set(0, 0.24, 0);
    scene.add(wr);

    const routeMeshes = [];
    const legendItems = new Map();

    const makeLegendIcon = (color) => {
      const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      icon.setAttribute('width', '18');
      icon.setAttribute('height', '18');
      icon.setAttribute('viewBox', '0 0 18 18');
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', '9');
      circle.setAttribute('cy', '9');
      circle.setAttribute('r', '6');
      circle.setAttribute('fill', `#${color.toString(16).padStart(6, '0')}`);
      icon.append(circle);
      return icon;
    };

    Object.entries(routes).forEach(([name, route]) => {
      const points = route.points.map(([x, y, z]) => new THREE.Vector3(x, y + 0.08, z));
      const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.18);
      const geometry = new THREE.TubeGeometry(curve, 80, 0.09, 12, false);
      const material = new THREE.MeshStandardMaterial({
        color: route.color,
        transparent: true,
        opacity: 0.84,
        roughness: 0.35,
        metalness: 0.12,
        emissive: route.color,
        emissiveIntensity: 0.18,
      });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.userData = { name, ...route };
      scene.add(mesh);
      routeMeshes.push(mesh);

      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<span class="legend-label"><span class="legend-icon"></span><span><strong>${name}</strong><br>${route.category}</span></span><span>${route.beats.split(',')[0]}</span>`;
      item.querySelector('.legend-icon').append(makeLegendIcon(route.color));
      legend.append(item);
      legendItems.set(name, item);
    });

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let selectedRoute = null;

    const updateInfo = (name) => {
      const route = routes[name];
      routeName.textContent = name;
      routeCategory.textContent = route.category;
      routeDesc.textContent = route.desc;
      routeBeats.textContent = route.beats;
    };

    const setSelection = (name) => {
      selectedRoute = name;
      updateInfo(name);

      routeMeshes.forEach((mesh) => {
        const active = mesh.userData.name === name;
        mesh.material.opacity = active ? 1 : 0.24;
        mesh.material.emissiveIntensity = active ? 0.55 : 0.08;
      });

      legendItems.forEach((item, routeNameKey) => {
        item.style.borderColor = routeNameKey === name ? 'var(--cp-accent)' : 'var(--cp-border)';
        item.style.background = routeNameKey === name ? 'var(--cp-accent-soft)' : 'var(--cp-surface)';
      });
    };

    const onPointerDown = (event) => {
      const bounds = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - bounds.left) / bounds.width) * 2 - 1;
      pointer.y = -((event.clientY - bounds.top) / bounds.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hit = raycaster.intersectObjects(routeMeshes, false)[0];
      if (hit?.object?.userData?.name) {
        setSelection(hit.object.userData.name);
      }
    };

    renderer.domElement.addEventListener('pointerdown', onPointerDown);

    const resize = () => {
      const width = sceneHost.clientWidth;
      const height = sceneHost.clientHeight;
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    };

    const tick = () => {
      requestAnimationFrame(tick);
      controls.update();
      renderer.render(scene, camera);
    };

    window.addEventListener('resize', resize);
    resize();
    setSelection('Go/Fade');
    tick();
  </script>
</body>
</html>
