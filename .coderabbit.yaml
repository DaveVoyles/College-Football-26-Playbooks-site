# CodeRabbit AI review config — https://docs.coderabbit.ai/guides/configure-coderabbit
# Static HTML site. sw.js is hand-written, so it stays under review.
language: en-US
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: false
  collapse_walkthrough: true

  in_progress_fortune: false   # no "fortune cookie" filler comment while it works
  sequence_diagrams: true      # diagrams in the walkthrough
  slop_detection:
    enabled: true              # flags low-effort / AI-slop PRs (free on public repos)

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  path_filters:
    - "!assets/icons/**"
    - "!**/*.lock"
    - "!**/*.min.js"
    - "!**/*.min.css"

  tools:
    github-checks:
      enabled: true

chat:
  auto_reply: true
